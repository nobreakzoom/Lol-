name: Scrape agences Orpi

on:
  workflow_dispatch:
    inputs:
      limit:
        description: "Nb max d'agences (0 = toutes)"
        default: "0"
      workers:
        description: "Requêtes en parallèle"
        default: "4"

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Scrape
        env:
          LIMIT: ${{ inputs.limit }}
          WORKERS: ${{ inputs.workers }}
          OUT_DIR: data
        run: python -u scrape_orpi.py
      - uses: actions/upload-artifact@v4
        with:
          name: agences_orpi
          path: data/agences_orpi.xlsx

      - name: Commit résultats (cache + xlsx)
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "data: agences Orpi $(date -u +%F)"
          git push
